name: Update Resume Gist

on:
  push:
    paths:
      - "resume.yaml"
      - ".github/workflows/gist.yml"
    branches:
      - main
  pull_request:
    paths: 
      - "resume.yaml"
      - ".github/workflows/gist.yml"

env:
    GIST_ID: c93f9f2f39f0dd930b076decee6b1592  # https://gist.github.com/NowanIlfideme/c93f9f2f39f0dd930b076decee6b1592

jobs:
  update-resume-gist:
    name: "Update resume.json gist"
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    - name: Data Format Converter Action
      id: yaml_to_json
      uses: fabasoad/data-format-converter-action@v0.2.3
      with:
        input: resume.yaml
        from: yaml
        to: json
    - name: Write JSON file
      run: |
        cat >> resume.json << EOF 
        ${{ steps.yaml_to_json.outputs.output }}
        EOF
    - name: Update Resume Gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.GIST_TOKEN }}
        gist_id: ${{ env.GIST_ID }}
        file_path: resume.json
  generate-pdf:
    name: "Generate PDF output"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    - name: Export resume to PDF
      uses: Devleaps/jsonresume-generator@v1
      id: jsonresume-to-pdf
      with:
        action: "render"
        file: "resume.yaml"
        # folder: ""
        output-type: "pdf"
        theme-local: false
        theme-name: "jsonresume-theme-stackoverflow"
        # theme-name: "stackoverflow"
    - name: Upload PDF as Artifact (ZIP only)
      uses: actions/upload-artifact@v4
      with:
        name: "anatoly-makarevich-resume"
        path: "resume.pdf"
    - name: Upload PDF as a 'Release' Artifact
      uses: softprops/action-gh-release@v2
      # if: startsWith(github.ref, 'refs/tags/')
      with:
        files: resume.pdf